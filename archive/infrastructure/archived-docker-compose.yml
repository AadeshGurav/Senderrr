# Archived: docker-compose.yml — Archived 2026-07-19
#
# This file was the local development and self-hosting Docker Compose setup.
# It has been archived because Render.com deployment uses a different model:
# a single Docker web service with a persistent disk mount.
#
# KEY DIFFERENCES between this file and render.yaml:
#   - This: multiple services (senderrr + ngrok + optional postgres/redis)
#   - Render: single service, SQLite on persistent disk, no external deps
#   - This: port 2785, manual healthcheck command
#   - Render: port 10000 (set by Render), Render-managed health checks
#
# WHAT'S ARCHIVED:
#   - ngrok service (lines 41-51): tunnel for webhook testing during local dev
#     On Render, HTTPS is provided by the platform automatically
#   - The senderrr service config itself (kept for reference)
#
# TO REACTIVATE FOR LOCAL DEV:
#   1. Create volume: docker volume create openwa_openwa-data
#   2. Run: docker compose up -d
#   3. Run with ngrok: docker compose --profile ngrok up -d
#   4. Access at http://localhost:2785

# Senderrr - Pure Node.js Stack

services:
  senderrr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senderrr
    restart: unless-stopped
    ports:
      - '127.0.0.1:2785:2785'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=2785
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENGINE_TYPE=${ENGINE_TYPE:-whatsapp-web.js}
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=${PUPPETEER_HEADLESS:-true}
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-zygote
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - SCRAPER_TARGET_URLS=${SCRAPER_TARGET_URLS:-}
      - DATABASE_SYNCHRONIZE=true
      - SCRAPER_ACTIVE_HOUR_START=${SCRAPER_ACTIVE_HOUR_START:-0}
      - SCRAPER_ACTIVE_HOUR_END=${SCRAPER_ACTIVE_HOUR_END:-23}
      - AUTOMATION_HOURLY_LIMIT=${AUTOMATION_HOURLY_LIMIT:-500}
      - AUTOMATION_DAILY_LIMIT=${AUTOMATION_DAILY_LIMIT:-5000}
      - AUTOMATION_JITTER_MIN=${AUTOMATION_JITTER_MIN:-30}
      - AUTOMATION_JITTER_MAX=${AUTOMATION_JITTER_MAX:-120}
      - AUTOMATION_QUIET_HOUR_START=${AUTOMATION_QUIET_HOUR_START:-21}
      - AUTOMATION_QUIET_HOUR_END=${AUTOMATION_QUIET_HOUR_END:-3}
    volumes:
      - senderrr-data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ────────────────────────────────────────────────────────────────────────────
  # ngrok tunnel for webhook testing
  # ARCHIVED: ngrok is only for local development. On Render, HTTPS is
  # provided by the platform. Webhook destinations point to Render's URL.
  #
  # To use: docker compose --profile ngrok up -d
  # Requires: NGROK_AUTH_TOKEN and optionally NGROK_URL in .env
  # ────────────────────────────────────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: senderrr-ngrok
    profiles:
      - ngrok
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTH_TOKEN:-}
    command: http senderrr:2785 ${NGROK_URL:+--url=}${NGROK_URL}
    depends_on:
      - senderrr
    restart: unless-stopped

volumes:
  senderrr-data:
    external: true
    name: openwa_openwa-data

