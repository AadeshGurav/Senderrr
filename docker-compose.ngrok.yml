# ngrok tunnel for webhook testing
# Start: docker compose -f docker-compose.ngrok.yml up -d
# Dashboard: http://localhost:4040

services:
  ngrok:
    image: wernight/ngrok:latest
    container_name: openwa-ngrok
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTH_TOKEN: ${NGROK_AUTH_TOKEN:-}
    command: http openwa:2785 --host-header=rewrite
    depends_on:
      - openwa
    networks:
      - openwa_default
    restart: unless-stopped

networks:
  openwa_default:
    external: true