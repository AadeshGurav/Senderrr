# render.yaml — Render Blueprint for Senderrr (OpenWA)
# Deploys Senderrr on Render's free tier with a persistent disk for session data.
#
# IMPORTANT FREE TIER NOTES:
# - Free instance sleeps after 15 min inactivity. Keep-alive ping is enabled by default.
# - Zero-downtime deploys are disabled (persistent disk constraint). Brief downtime on deploys.
# - Cannot scale to multiple instances (persistent disk constraint).
# - Build pipeline has limited memory; large projects may need Performance tier.
# - 750 free instance hours/month — one service fits comfortably in this budget.
#
# USAGE:
#   1. Push this file and the codebase to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Connect your GitHub repo
#   4. Render auto-detects render.yaml and provisions the service
#   5. Set environment variables (secrets) via the dashboard
#
# TO UPDATE EXISTING DEPLOY:
#   git push   # triggers automatic redeploy
#   # or use: render deploy --service=<service-name>
#
# PERSISTENT DISK:
#   WhatsApp sessions, SQLite database, and media files are stored on the
#   persistent disk mounted at RENDER_DISK_PATH. This survives restarts and deploys.
#   Without it, sessions are lost on every deploy (QR code re-scan required).
#   Default size: 1 GB. Resize in the Render Dashboard → Disks tab.
#
# ENVIRONMENT VARIABLES:
#   Set these via the Render Dashboard → your service → Environment tab.
#   All non-secret values are documented in .render/env.yaml for reference.
#   Secrets (WA_JWT_SECRET, API_KEY) must be set in the dashboard — they are NOT
#   in any committed file for security reasons.

services:
  - type: web
    name: senderrr
    # Free tier — no monthly cost. No auto-scaling.
    plan: free
    region: oregon

    # Build and runtime
    runtime: docker
    dockerfilePath: ./Dockerfile

    # Health check — Render routes traffic only after this returns 200.
    # /api/health/live is the liveness probe (bypasses /api prefix).
    healthCheckPath: /api/health/live

    # Graceful shutdown — give in-flight requests time to complete
    # before the process is killed. Critical for WhatsApp message delivery.
    maxShutdownDelaySeconds: 120

    # Environment variables — set these in the Render Dashboard
    # See .render/env.yaml for the full reference list with descriptions.
    # CRITICAL secrets (set via dashboard, not committed):
    #   WA_JWT_SECRET   — JWT signing secret for WA Automation
    #   API_KEY         — Admin API key (master key for the entire API)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      # ── Secrets (set in dashboard, not committed) ───────────────
      # - key: WA_JWT_SECRET
      #   sync: false   # prompted during Blueprint creation
      # - key: API_KEY
      #   sync: false   # prompted during Blueprint creation
      # ── Free tier optimization ───────────────────────────────────
      - key: REDIS_ENABLED
        value: "false"
      - key: QUEUE_ENABLED
        value: "false"
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "420000"
      # ── Security hardening ───────────────────────────────────────
      - key: ENFORCE_HTTPS
        value: "true"
      - key: TRUSTED_PROXIES
        value: "0.0.0.0/0"
      # ── Rate limiting (tightened for public API) ─────────────────
      - key: RATE_LIMIT_SHORT_LIMIT
        value: "10"
      - key: RATE_LIMIT_MEDIUM_LIMIT
        value: "100"
      - key: RATE_LIMIT_LONG_LIMIT
        value: "500"
      # ── Persistent disk paths ────────────────────────────────────
      - key: DATABASE_TYPE
        value: "sqlite"
      - key: DATABASE_NAME
        value: "/var/data/openwa.sqlite"
      - key: STORAGE_TYPE
        value: "local"
      - key: STORAGE_LOCAL_PATH
        value: "/var/data/media"
      - key: SESSION_DATA_PATH
        value: "/var/data/sessions"
      # ── Puppeteer (Chromium in container) ────────────────────────
      - key: PUPPETEER_ARGS
        value: "--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-software-rasterizer,--no-first-run"
      # ── Logging ──────────────────────────────────────────────────
      - key: DATABASE_LOGGING
        value: "false"
      - key: LOG_LEVEL
        value: "info"
      # ── Optional: CORS origins (uncomment and set your domains) ──
      # - key: CORS_ORIGINS
      #   sync: false

    # Persistent disk — stores WhatsApp sessions, SQLite DB, media files.
    # ATTACHED DISK constraints:
    #   - Cannot scale to multiple instances
    #   - Zero-downtime deploys are disabled (brief downtime on redeploy)
    #   - Disk I/O is slower than instance storage
    disk:
      name: senderrr-data
      mountPath: /var/data
      sizeGB: 1

    # Auto-deploy on every push to `main` branch
    autoDeploy: true

    # Branch filter — only deploy from main branch
    branch: main