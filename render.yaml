# render.yaml — Render Blueprint for Senderrr (OpenWA)
# Deploys Senderrr on Render's free tier with a persistent disk for session data.
#
# IMPORTANT FREE TIER NOTES:
# - Free instance sleeps after 15 min inactivity. Keep-alive ping is enabled by default.
# - Zero-downtime deploys are disabled (persistent disk constraint). Brief downtime on deploys.
# - Cannot scale to multiple instances (persistent disk constraint).
# - Build pipeline has limited memory; large projects may need Performance tier.
# - 750 free instance hours/month — one service fits comfortably in this budget.
#
# USAGE:
#   1. Push this file and the codebase to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Connect your GitHub repo
#   4. Render auto-detects render.yaml and provisions the service
#   5. Set environment variables (secrets) via the dashboard
#
# TO UPDATE EXISTING DEPLOY:
#   git push   # triggers automatic redeploy
#   # or use: render deploy --service=<service-name>
#
# PERSISTENT DISK:
#   WhatsApp sessions, SQLite database, and media files are stored on the
#   persistent disk mounted at RENDER_DISK_PATH. This survives restarts and deploys.
#   Without it, sessions are lost on every deploy (QR code re-scan required).
#   Default size: 1 GB. Resize in the Render Dashboard → Disks tab.

includes:
  - envVars: .render/env.yaml

services:
  - type: web
    name: senderrr
    # Free tier — no monthly cost. No auto-scaling.
    plan: free
    region: oregon

    # Build and runtime
    runtime: docker
    dockerfilePath: ./Dockerfile

    # Health check — Render routes traffic only after this returns 200.
    # /api/health/live is the root-level liveness probe (bypasses /api prefix).
    healthCheckPath: /api/health/live
    healthCheckInterval: 30
    healthCheckTimeout: 10
    healthCheckFailureThreshold: 3

    # Graceful shutdown — give in-flight requests 120s to complete
    # before the process is killed. Critical for WhatsApp message delivery.
    maxShutdownDelaySeconds: 120

    # Environment variables — loaded from .render/env.yaml
    # Secrets (sync: false) are prompted during Blueprint creation and stored securely.
    envVars:
      - fromGroup: senderrr-config

    # Persistent disk — stores WhatsApp sessions, SQLite DB, media files.
    # ATTACHED DISK constraints:
    #   - Cannot scale to multiple instances
    #   - Zero-downtime deploys are disabled (brief downtime on redeploy)
    #   - Disk I/O is slower than instance storage
    disk:
      name: senderrr-data
      mountPath: /var/data
      sizeGB: 1

    # Auto-deploy on every push to `main` branch
    autoDeploy: true

    # Branch filter — only deploy from main branch
    branch: main

# Environment group — shared environment variables across services.
# Secrets (sync: false) are NOT committed to the repo; values are entered
# during Blueprint creation and stored in Render's secret manager.
envGroups:
  senderrr-config:
    - key: NODE_ENV
      value: production
    - key: PORT
      value: 10000
    - key: HOST
      value: 0.0.0.0
    # JWT secret for WA Automation operator authentication
    # IMPORTANT: Change this to a strong random value in production
    - key: WA_JWT_SECRET
      sync: false
    # Initial admin API key — generated by Render during first deploy
    # IMPORTANT: Set a strong value; this is the master key for the entire API
    - key: API_KEY
      sync: false
    # Disable Redis/BullMQ on free tier (no Redis = no extra cost)
    - key: REDIS_ENABLED
      value: "false"
    - key: QUEUE_ENABLED
      value: "false"
    # Keep-alive ping: prevent free tier spin-down every 7 minutes
    - key: KEEP_ALIVE_ENABLED
      value: "true"
    - key: KEEP_ALIVE_INTERVAL_MS
      value: "420000"
    # Security hardening for public internet exposure
    - key: ENFORCE_HTTPS
      value: "true"
    - key: TRUSTED_PROXIES
      value: "0.0.0.0/0"
    # Rate limiting — tighten for public API
    - key: RATE_LIMIT_SHORT_LIMIT
      value: "10"
    - key: RATE_LIMIT_MEDIUM_LIMIT
      value: "100"
    - key: RATE_LIMIT_LONG_LIMIT
      value: "500"
    # SQLite on persistent disk (zero-cost, no external dependency)
    - key: DATABASE_TYPE
      value: "sqlite"
    - key: DATABASE_NAME
      value: "/var/data/openwa.sqlite"
    # Local storage on persistent disk
    - key: STORAGE_TYPE
      value: "local"
    - key: STORAGE_LOCAL_PATH
      value: "/var/data/media"
    # WhatsApp session persistence on disk (critical — survives restarts)
    - key: SESSION_DATA_PATH
      value: "/var/data/sessions"
    # Puppeteer args for containerized environment
    - key: PUPPETEER_ARGS
      value: "--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-software-rasterizer,--no-first-run"
    # Disable noisy database logging in production
    - key: DATABASE_LOGGING
      value: "false"
    # CORS — restrict to specific domains in production (comma-separated)
    # For development/testing, leave empty to allow all origins
    # Example: https://yourdomain.com,https://app.yourdomain.com
    # - key: CORS_ORIGINS
    #   sync: false