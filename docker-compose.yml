# OpenWA - Pure Node.js Stack
# OpenWA has BullMQ and Redis built-in - no external services needed

services:
  openwa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openwa
    restart: unless-stopped
    ports:
      - '127.0.0.1:2785:2785'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=2785
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENGINE_TYPE=${ENGINE_TYPE:-whatsapp-web.js}
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=${PUPPETEER_HEADLESS:-true}
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - SCRAPER_TARGET_URLS=${SCRAPER_TARGET_URLS:-}
      - SCRAPER_ACTIVE_HOUR_START=${SCRAPER_ACTIVE_HOUR_START:-0}
      - SCRAPER_ACTIVE_HOUR_END=${SCRAPER_ACTIVE_HOUR_END:-23}
      - AUTOMATION_HOURLY_LIMIT=${AUTOMATION_HOURLY_LIMIT:-500}
      - AUTOMATION_DAILY_LIMIT=${AUTOMATION_DAILY_LIMIT:-5000}
      - AUTOMATION_JITTER_MIN=${AUTOMATION_JITTER_MIN:-30}
      - AUTOMATION_JITTER_MAX=${AUTOMATION_JITTER_MAX:-120}
      - AUTOMATION_QUIET_HOUR_START=${AUTOMATION_QUIET_HOUR_START:-1}
      - AUTOMATION_QUIET_HOUR_END=${AUTOMATION_QUIET_HOUR_END:-7}
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  openwa-data:
    driver: local