<form hx-post="{% url 'dashboard:add_community' %}"
      hx-target="#community-section"
      hx-swap="innerHTML"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% csrf_token %}
  <div class="add-form">
    <div class="add-form-field">
      <label>Community name</label>
      {{ community_form.name }}
    </div>
    <div class="add-form-field">
      <label>Community JID / Search name</label>
      {{ community_form.community_jid }}
    </div>
    <div class="add-form-actions">
      <button type="submit">Add Community</button>
    </div>
  </div>
  {% if community_form.errors %}
  <div class="callout callout--warn" style="margin-top:6px">{{ community_form.errors }}</div>
  {% endif %}
</form>
