<div class="admin-card admin-card--editing" id="admin-row-{{ admin.pk }}">
  <form hx-post="{% url 'dashboard:edit_admin' admin.pk %}"
        hx-target="#admin-row-{{ admin.pk }}"
        hx-swap="outerHTML"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        style="width:100%">
    {% csrf_token %}
    <div class="admin-edit-fields">
      <div class="add-form-field">
        <label>Label</label>
        {{ admin_form.label }}
      </div>
      <div class="add-form-field">
        <label>Phone</label>
        {{ admin_form.phone_number }}
      </div>
      <div class="add-form-field" style="flex:0 1 90px;min-width:70px">
        <label>Sessions</label>
        {{ admin_form.sessions_per_admin }}
      </div>
      <div class="add-form-field add-form-field--checkbox">
        <label class="checkbox-label">
          {{ admin_form.skip_warmup }} Skip warm-up
        </label>
      </div>
    </div>
    {% if admin_form.errors %}
    <div class="callout callout--warn" style="margin-top:8px">{{ admin_form.errors }}</div>
    {% endif %}
    <div class="admin-edit-actions">
      <button type="submit">Save</button>
      <button type="button" class="outline secondary"
              hx-get="{% url 'dashboard:edit_admin' admin.pk %}"
              hx-target="#admin-row-{{ admin.pk }}"
              hx-swap="outerHTML"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>Cancel</button>
    </div>
  </form>
</div>
