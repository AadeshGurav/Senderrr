<!-- Add group form -->
<div id="group-form-container">
  {% include "dashboard/partials/group_form.html" %}
</div>

<!-- Group table -->
{% if groups %}
<table role="grid">
  <thead>
    <tr>
      <th>Name</th>
      <th>Group JID</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="group-table-body">
    {% for group in groups %}
    {% include "dashboard/partials/group_row.html" %}
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>No groups added yet. Add one above to get started.</p>
{% endif %}
