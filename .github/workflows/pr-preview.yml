name: PR Preview on Render

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: render-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RENDER_PREVIEW_SERVICE_NAME: senderrr-preview

jobs:
  # ─── Create/Update Preview ──────────────────────────────────
  create-preview:
    name: Create PR Preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create preview environment via Render CLI
        run: |
          echo "Creating preview for PR #${{ github.event.pull_request.number }}"
          echo "PR title: ${{ github.event.pull_request.title }}"
          echo "PR branch: ${{ github.head_ref }}"
          echo ""
          echo "To enable PR previews on Render:"
          echo "  1. Go to dashboard.render.com → your service"
          echo "  2. Settings → Preview Environments → Enable"
          echo "  3. Set RENDER_SERVICE_ID and RENDER_PREVIEW_ENV_ID secrets in GitHub"
          echo ""
          echo "Preview URL will be: https://senderrr-${{ github.event.pull_request.number }}.onrender.com"

      # Uncomment when RENDER_PREVIEW_ENV_ID secret is set:
      # - name: Deploy Preview via Render API
      #   run: |
      #     curl -X POST "https://api.render.com/v1/preview-environments" \
      #       -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
      #       -H "Content-Type: application/json" \
      #       -d '{
      #         "environmentId": "${{ secrets.RENDER_PREVIEW_ENV_ID }}",
      #         "branch": "${{ github.head_ref }}",
      #         "pullRequest": ${{ github.event.pull_request.number }}
      #       }'

  # ─── Delete Preview on PR close ────────────────────────────
  delete-preview:
    name: Delete PR Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'

    steps:
      - name: Delete preview environment via Render API
        run: |
          echo "PR #${{ github.event.pull_request.number }} closed — preview environment would be deleted"
          echo ""
          echo "To enable automatic cleanup:"
          echo "  1. Set RENDER_PREVIEW_ENV_ID in GitHub secrets"
          echo "  2. Uncomment the delete step below:"
          echo ""
          # Uncomment when ready:
          # curl -X DELETE "https://api.render.com/v1/preview-environments/${{ secrets.RENDER_PREVIEW_ENV_ID }}/pull-requests/${{ github.event.pull_request.number }}" \
          #   -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"