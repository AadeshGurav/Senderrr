name: Deploy to Render

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Only one deploy should run at a time per branch
concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/senderrr
  RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}

jobs:
  # ─── Test & Build ─────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Run unit tests
        run: npx jest --passWithNoTests --coverage=false

      - name: Build application
        run: npm run build

      - name: Build dashboard
        run: |
          cd dashboard
          npm ci
          npm run build

  # ─── Build Docker Image (on PR and main) ────────────────────
  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=sha256
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=-{{date 'YYYYMMDD'}},format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ─── Deploy to Render (main branch only) ───────────────────
  deploy:
    name: Deploy to Render
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via Render CLI
        uses: render-oss/deploy-to-render@v1
        with:
          service-id: ${{ vars.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
        id: deploy

      - name: Wait for deploy to complete
        run: |
          echo "Waiting for Render deploy..."
          sleep 30
          echo "Deploy triggered. Monitor at: https://dashboard.render.com"

      - name: Health check after deploy
        run: |
          URL="${{ vars.RENDER_SERVICE_URL }}"
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/api/health/live" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Service is healthy at ${URL}"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE — retrying in 10s..."
            sleep 10
          done
          echo "✗ Service health check failed after 5 attempts"
          exit 1

  # ─── Notify on failure ──────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    needs: [test, build, deploy]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Notify via GitHub Status
        run: |
          echo "Deploy failed. Check the workflow run at:"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify Slack (optional)
        if: secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Senderrr deploy to Render FAILED",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Senderrr Deploy Failed*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nWorkflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK