# .render/env.yaml — Environment variable reference for Senderrr on Render
#
# This file documents the expected environment variables.
# DO NOT commit real secret values here. Variables marked with
# sync: false are prompted during Blueprint creation and stored
# in Render's secret manager, never in this file.
#
# HOW IT WORKS:
#   - render.yaml references this file via `includes: [.render/env.yaml]`
#   - Variables with `sync: false` in render.yaml are NOT read from this file
#   - Instead, Render prompts for their values during Blueprint creation
#   - Values are stored in Render's secret manager and injected at runtime
#
# FOR LOCAL DEVELOPMENT:
#   Copy this file to .env and fill in values:
#     cp .render/env.yaml .env
#   Then edit .env with your local values.

# ── REQUIRED SECRETS (sync: false — do not commit) ────────────────

# JWT secret for WA Automation operator authentication
# Generate with: node -e "console.log(require('crypto').randomUUID())"
WA_JWT_SECRET: CHANGE_ME_generate_a_strong_random_string

# Initial admin API key — the master key for the entire API
# Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
API_KEY: CHANGE_ME_generate_a_strong_random_string

# CORS allowed origins (comma-separated URLs)
# Leave empty for same-origin only, or list your domains
# Example: https://yourdomain.com,https://app.yourdomain.com
CORS_ORIGINS: ""

# ── RENDER PLATFORM (auto-set by Render) ──────────────────────────

# RENDER_DISK_PATH: Set automatically by Render when a persistent disk is attached.
# When set, all data paths (sessions, SQLite, media) point to this disk.
# Do not set this manually — it's managed by Render's disk provisioning.
# RENDER_DISK_PATH: /var/data

# ── APPLICATION CONFIGURATION ─────────────────────────────────────

NODE_ENV: production
PORT: 10000
HOST: 0.0.0.0

# ── FREE TIER OPTIMIZATION ────────────────────────────────────────

# No Redis on free tier — BullMQ disabled, webhooks delivered synchronously
REDIS_ENABLED: "false"
QUEUE_ENABLED: "false"

# Keep-alive ping every 7 minutes (< 15 min free spin-down threshold)
KEEP_ALIVE_ENABLED: "true"
KEEP_ALIVE_INTERVAL_MS: "420000"

# ── SECURITY HARDENING (public internet) ──────────────────────────

ENFORCE_HTTPS: "true"
TRUSTED_PROXIES: "0.0.0.0/0"

# Tightened rate limits for public API
RATE_LIMIT_SHORT_LIMIT: "10"
RATE_LIMIT_MEDIUM_LIMIT: "100"
RATE_LIMIT_LONG_LIMIT: "500"

# ── PERSISTENT DISK PATHS ──────────────────────────────────────────

# SQLite database on persistent disk
DATABASE_TYPE: sqlite
DATABASE_NAME: /var/data/openwa.sqlite

# Media storage on persistent disk
STORAGE_TYPE: local
STORAGE_LOCAL_PATH: /var/data/media

# WhatsApp session state (Chrome profiles) on persistent disk
SESSION_DATA_PATH: /var/data/sessions

# ── PUPPETEER (Chromium in container) ─────────────────────────────

# Puppeteer args optimized for containerized environment
PUPPETEER_ARGS: "--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-software-rasterizer,--no-first-run"

# ── LOGGING ───────────────────────────────────────────────────────

DATABASE_LOGGING: "false"
LOG_LEVEL: info